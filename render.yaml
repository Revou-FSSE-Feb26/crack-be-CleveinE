services:
  - type: web
    name: carchery-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
